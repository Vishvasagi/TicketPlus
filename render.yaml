databases:
  - name: ticketpulse-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: ticketpulse
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python migrate.py"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ticketpulse-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
