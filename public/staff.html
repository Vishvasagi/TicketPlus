<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TicketPulse | Staff</title><link rel="stylesheet" href="app.css"></head><body><div class="app"><header><div class="brand"><b><i>✓</i>TicketPulse</b><span class="role">STAFF PORTAL</span></div><div class="title"><h1>Daily task update</h1><p>Send your current pending work and any manager escalation.</p></div></header><main class="content"><div id="notice"></div><form class="card" id="reportForm"><h2>Submit today’s work</h2><p class="help">This update is sent directly to the manager dashboard.</p><div class="two"><div class="field"><label>Staff member</label><select id="staffId" required></select></div><div class="field"><label>Report date</label><input id="reportDate" type="date" required></div></div><div class="section"><h2>Pending tasks</h2><button class="outline" type="button" id="addTask">+ Add task</button></div><div id="tasks"></div><label class="toggle"><input type="checkbox" id="critical"> Mark as critical — needs manager follow-up</label><div class="conditional" id="criticalFields"><div class="two"><div class="field"><label>Follow-up target date</label><input id="followDate" type="date"></div><div class="field"><label>Remark for manager</label><textarea id="remark" placeholder="Explain the blocker or escalation."></textarea></div></div></div><div class="actions"><span></span><button class="primary">Send update</button></div></form></main></div><script src="staff.js"></script></body></html>
