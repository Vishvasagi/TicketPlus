databases:
  - name: ticketpulse-db
    plan: free
    postgresMajorVersion: 16

services:
  # Staff portal — its own URL. Staff log in with credentials created by
  # their manager, then submit daily status updates.
  - type: web
    name: ticketpulse-staff
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python migrate.py"
    startCommand: "gunicorn staff_app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ticketpulse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      # Optional — set these to control the default manager account created
      # on first deploy. If omitted, a random password is generated and
      # printed once in this service's build logs.
      # - key: DEFAULT_MANAGER_USERNAME
      #   value: admin
      # - key: DEFAULT_MANAGER_PASSWORD
      #   value: change-me-immediately

  # Manager portal — its own URL. Shares the same database as the staff
  # service above. Manages departments, ticket statuses, and staff accounts.
  - type: web
    name: ticketpulse-manager
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn manager_app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ticketpulse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
